---
<article class="sky-source" data-id="{{ entry.key }}" data-year="{{ entry.year }}" data-authors="{% for author in entry.author_array limit:1 %}{{ author.last | escape }}{% endfor %}{% if entry.author_array.size > 1 %} et al.{% endif %}" data-venue="{{ entry.journal | escape }}">
  <h3>{{ entry.title }}</h3>
  <p class="sky-citation">{{ reference }}</p>
  {% if entry.doi %}<a href="https://doi.org/{{ entry.doi }}">Read publication</a>{% elsif entry.arxiv %}<a href="https://arxiv.org/abs/{{ entry.arxiv }}">Read preprint</a>{% endif %}
</article>
