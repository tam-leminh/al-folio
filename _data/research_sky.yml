# Each thread owns its membership and edges; papers can belong to multiple threads.
threads:
  - id: ecological-network-inference
    title: "From ecological networks to U-statistics"
    papers: [dubart2022coupling, leminh2023ustatistics, leminh2025hoeffding, leminh2026characterization]
    edges:
      - from: dubart2022coupling
        to: leminh2023ustatistics
        relation: ecological-question-and-theoretical-response
        text: >-
          An ecological question prompted the theoretical work on U-statistics for
          bipartite networks, first published in *ESAIM: Probability and Statistics*
          and subsequently extended in *Electronic Journal of Statistics* and
          *Information and Inference*. The ecological chapter also proposed this
          framework as an approach to network analysis.
      - { from: leminh2023ustatistics, to: leminh2025hoeffding, relation: related-theoretical-work }
      - { from: leminh2025hoeffding, to: leminh2026characterization, relation: related-theoretical-work }
  - id: variational-methods
    title: "Variational methods and modal estimation"
    papers: [leminh2026natural, leminh2026variational]
    edges:
      - from: leminh2026natural
        to: leminh2026variational
        relation: shared-methodological-framework
        text: >-
          Building on Khan and Rue’s Bayesian Learning Rule, we developed a
          variational approach to multimodal optimization (*Information and Inference*),
          then extended this framework to the statistical problem of mode estimation
          (*preprint*).
projects:
  - id: degenerate
    title: "Inference for degenerate network U-statistics"
    summary: "Follow-up work on degeneracy, variance estimation and inference for row-column exchangeable arrays."
  - id: density
    title: "Sampling and density in bipartite networks"
    summary: "Studying how marginal frequencies and their coupling shape network density as interaction events accumulate."
  - id: bnp
    title: "Bayesian nonparametric interaction networks"
    summary: "Modelling latent communities and partner dependence, with prediction of previously unobserved nodes."
  - id: birds
    title: "Community structure and species exclusions"
    summary: "Bayesian mixture modelling of ecological counts, distinguishing community composition from sampling zeros. Applications include Finnish birds and environmental DNA."
  - id: crime
    title: "Latent communities and roles in collective events"
    summary: "Modelling co-participation events to distinguish community membership from actor roles, motivated by co-offending networks."
